---
resource_types:
  - name: github-token-resource
    type: registry-image
    source:
      repository: ghcr.io/tenjaa/concourse-github-app-token
      tag: latest
  - name: cron-resource
    type: registry-image
    check_every: 20m
    source:
      repository: governmentdigitalservice/pay-cron-resource
      tag: "2026-07-21_08-34-52"
resources:
  - name: github-token
    type: github-token-resource
    source:
      appId: "((github-app.id))"
      privateKey: "((github-app.private-key))"
      user: samsimpson1
  - name: cron-trigger
    type: cron-resource
    source:
      expression: "37 */2 * * *"
      location: "Europe/London"
      fire_immediately: true
jobs:
  - name: renovate
    plan:
      - get: cron-trigger
        trigger: true
      - put: github-token
      - load_var: github-token
        file: github-token/token
      - task: run-renovate
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ghcr.io/renovatebot/renovate
              tag: "44.65"
          run:
            path: renovate
          params:
            RENOVATE_PLATFORM: "github"
            RENOVATE_TOKEN: "((.:github-token))"
            RENOVATE_AUTODISCOVER: "false"
            RENOVATE_REPOSITORIES: "samsimpson1/ansible,samsimpson1/pipelines"
